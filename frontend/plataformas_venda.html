<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
    <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ERP Maneiro">
    <title>ERP Maneiro - Plataformas de Venda</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/permissions.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modulos.css">
    <link rel="stylesheet" href="css/submenu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <script src="js/config.js"></script>
    <script src="js/avisos.js"></script>
    <link rel="stylesheet" href="css/celular.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="img/icon.png" alt="ERP Maneiro" class="logo-img">
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <h3 id="userName">Carregando...</h3>
                    <p id="userRole">Carregando...</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Preenchido pelo js/sidebar-template.js conforme as permissões do usuário -->
                <ul>
                    <li class="logout"><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="content">
                <div class="page-header">
                    <h1>Plataformas de Venda</h1>
                    <p>Cadastre e gerencie os métodos/plataformas de venda (Mercado Livre, Shopee, Loja Física, etc.)
                    </p>
                </div>

                <!-- Ações -->
                <div class="actions-bar">
                    <button class="btn-primary" id="btnNovaPlataforma">
                        <i class="fas fa-plus"></i> Nova Plataforma
                    </button>

                    <div class="filter-group">
                        <label for="filtroStatus">Status:</label>
                        <select id="filtroStatus">
                            <option value="">Todos</option>
                            <option value="true">Ativos</option>
                            <option value="false">Inativos</option>
                        </select>
                    </div>
                </div>

                <!-- Tabela de Plataformas -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>URL</th>
                                <th>Taxa (%)</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="plataformasTableBody">
                            <tr>
                                <td colspan="7" class="text-center">Carregando plataformas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div class="pagination">
                    <button class="btn-page"><i class="fas fa-chevron-left"></i></button>
                    <button class="btn-page active">1</button>
                    <button class="btn-page">2</button>
                    <button class="btn-page">3</button>
                    <button class="btn-page"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Nova/Editar Plataforma -->
    <div class="modal" id="plataformaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nova Plataforma de Venda</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="plataformaForm">
                    <input type="hidden" id="plataforma_id">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome da Plataforma*</label>
                            <input type="text" id="nome" name="nome" required
                                placeholder="Ex: Mercado Livre, Shopee, Loja Física">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="descricao">Descrição</label>
                            <textarea id="descricao" name="descricao" rows="3"
                                placeholder="Descrição da plataforma de venda"></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="url">URL/Link</label>
                            <input type="text" id="url" name="url" placeholder="https://www.exemplo.com">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="taxa_percentual">Taxa da Plataforma (%)</label>
                            <input type="number" id="taxa_percentual" name="taxa_percentual" step="0.01" min="0"
                                max="100" value="0" placeholder="Ex: 12.5">
                        </div>
                        <div class="form-group">
                            <label for="ativo">Status</label>
                            <select id="ativo" name="ativo">
                                <option value="true">Ativo</option>
                                <option value="false">Inativo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" id="btnCancelar">Cancelar</button>
                <button class="btn-primary" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar-template.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/setupModals.js"></script>
    <script src="js/plataformas_venda.js"></script>
    <script src="js/internal-animation.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>

</html>
