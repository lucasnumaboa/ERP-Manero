<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Maneiro - Chat</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/permissions.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/submenu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <style>
        /* ============ TABS ============ */
        .chat-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            border-bottom: 2px solid var(--border-color, rgba(100, 255, 218, 0.15));
        }

        .chat-tab {
            padding: 12px 28px;
            background: transparent;
            border: none;
            color: var(--text-muted, #8892b0);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-tab:hover {
            color: var(--accent-primary, #64ffda);
        }

        .chat-tab.active {
            color: var(--accent-primary, #64ffda);
        }

        .chat-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary, #64ffda);
        }

        .chat-tab-content {
            display: none;
            padding: 24px 0;
        }

        .chat-tab-content.active {
            display: block;
        }

        /* ============ CONFIG FORM ============ */
        .config-section {
            background: var(--gradient-card, rgba(17, 34, 64, 0.95));
            border: 1px solid var(--border-color, rgba(100, 255, 218, 0.1));
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
        }

        .config-section h3 {
            color: var(--accent-primary, #64ffda);
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-section h3 i {
            font-size: 18px;
        }

        .config-field {
            margin-bottom: 16px;
        }

        .config-field label {
            display: block;
            color: var(--text-primary, #e6f1ff);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .config-field input,
        .config-field textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input, rgba(10, 25, 47, 0.7));
            border: 1px solid var(--border-color, rgba(100, 255, 218, 0.15));
            border-radius: 8px;
            color: var(--text-primary, #e6f1ff);
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .config-field input:focus,
        .config-field textarea:focus {
            outline: none;
            border-color: var(--accent-primary, #64ffda);
        }

        .config-field textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        /* Regras de incremento */
        .regras-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .regra-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(10, 25, 47, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color, rgba(100, 255, 218, 0.1));
            flex-wrap: wrap;
        }

        .regra-item select,
        .regra-item input {
            padding: 8px 12px;
            background: var(--bg-input, rgba(10, 25, 47, 0.7));
            border: 1px solid var(--border-color, rgba(100, 255, 218, 0.15));
            border-radius: 6px;
            color: var(--text-primary, #e6f1ff);
            font-size: 13px;
        }

        .regra-item select {
            min-width: 160px;
        }

        .regra-item .regra-valor-input {
            width: 100px;
        }

        .regra-item .regra-km-input {
            width: 80px;
        }

        .regra-item .regra-dias-input {
            width: 200px;
        }

        .regra-extra {
            display: none;
        }

        .regra-extra.visible {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-remove-regra {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-remove-regra:hover {
            background: rgba(255, 82, 82, 0.3);
        }

        .btn-add-regra {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(100, 255, 218, 0.1);
            border: 1px dashed var(--accent-primary, #64ffda);
            border-radius: 8px;
            color: var(--accent-primary, #64ffda);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-add-regra:hover {
            background: rgba(100, 255, 218, 0.2);
        }

        .btn-save-config {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            background: var(--accent-primary, #64ffda);
            color: #0a192f;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save-config:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(100, 255, 218, 0.3);
        }

        .btn-save-config:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============ CHAT UI ============ */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 400px;
            background: var(--gradient-card, rgba(17, 34, 64, 0.95));
            border: 1px solid var(--border-color, rgba(100, 255, 218, 0.1));
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color, rgba(100, 255, 218, 0.1));
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary, #e6f1ff);
            font-weight: 600;
        }

        .chat-header-title i {
            color: var(--accent-primary, #64ffda);
            font-size: 20px;
        }

        .btn-clear-chat {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 6px;
            color: #ff5252;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear-chat:hover {
            background: rgba(255, 82, 82, 0.2);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(100, 255, 218, 0.2);
            border-radius: 3px;
        }

        .chat-message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: chatFadeIn 0.3s ease-out;
        }

        @keyframes chatFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-message.assistant {
            align-self: flex-start;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .chat-message.user .chat-avatar {
            background: rgba(100, 255, 218, 0.15);
            color: var(--accent-primary, #64ffda);
        }

        .chat-message.assistant .chat-avatar {
            background: rgba(138, 43, 226, 0.15);
            color: #bb86fc;
        }

        .chat-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .chat-message.user .chat-bubble {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.2);
            color: var(--text-primary, #e6f1ff);
            border-bottom-right-radius: 4px;
        }

        .chat-message.assistant .chat-bubble {
            background: rgba(138, 43, 226, 0.08);
            border: 1px solid rgba(138, 43, 226, 0.2);
            color: var(--text-primary, #e6f1ff);
            border-bottom-left-radius: 4px;
        }

        .chat-bubble strong {
            color: var(--accent-primary, #64ffda);
        }

        .chat-bubble code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .chat-typing {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            gap: 12px;
        }

        .chat-typing.visible {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 8px 16px;
            background: rgba(138, 43, 226, 0.08);
            border: 1px solid rgba(138, 43, 226, 0.2);
            border-radius: 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted, #8892b0);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid var(--border-color, rgba(100, 255, 218, 0.1));
            align-items: flex-end;
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        #chatInput {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input, rgba(10, 25, 47, 0.7));
            border: 1px solid var(--border-color, rgba(100, 255, 218, 0.15));
            border-radius: 12px;
            color: var(--text-primary, #e6f1ff);
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
            box-sizing: border-box;
        }

        #chatInput:focus {
            outline: none;
            border-color: var(--accent-primary, #64ffda);
        }

        .btn-send {
            padding: 12px 18px;
            background: var(--accent-primary, #64ffda);
            color: #0a192f;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(100, 255, 218, 0.3);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted, #8892b0);
            gap: 12px;
        }

        .chat-empty i {
            font-size: 48px;
            color: rgba(100, 255, 218, 0.2);
        }

        .chat-empty p {
            font-size: 15px;
            text-align: center;
            max-width: 380px;
            line-height: 1.6;
        }

        /* ============ THEME LIGHT ============ */
        body.theme-light .config-section {
            background: var(--bg-card, #ffffff);
            border-color: var(--border-color, #e0e0e0);
        }

        body.theme-light .chat-container {
            background: var(--bg-card, #ffffff);
            border-color: var(--border-color, #e0e0e0);
        }

        body.theme-light .chat-message.user .chat-bubble {
            background: rgba(52, 152, 219, 0.08);
            border-color: rgba(52, 152, 219, 0.2);
        }

        body.theme-light .chat-message.assistant .chat-bubble {
            background: rgba(156, 39, 176, 0.05);
            border-color: rgba(156, 39, 176, 0.15);
        }

        body.theme-light .chat-message.user .chat-avatar {
            background: rgba(52, 152, 219, 0.1);
            color: #3498db;
        }

        body.theme-light .chat-bubble strong {
            color: var(--accent-primary, #3498db);
        }

        body.theme-light .regra-item {
            background: rgba(0, 0, 0, 0.03);
            border-color: var(--border-color, #e0e0e0);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="img/icon.png" alt="ERP Maneiro" class="logo-img">
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <span id="userName">Carregando...</span>
                    <span id="userRole" class="user-role">Carregando...</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="homepage.html"><i class="fas fa-home"></i><span>Home</span></a>
                    </li>
                    <li class="logout">
                        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="content-body" style="padding: 24px;">
                <!-- Tabs -->
                <div class="chat-tabs">
                    <button class="chat-tab" id="tabConfig" onclick="switchTab('config')" style="display:none;">
                        <i class="fas fa-cog"></i> Configuração
                    </button>
                    <button class="chat-tab active" id="tabChat" onclick="switchTab('chat')">
                        <i class="fas fa-comments"></i> Chat
                    </button>
                </div>

                <!-- Tab: Configuração -->
                <div class="chat-tab-content" id="contentConfig">
                    <div class="config-section">
                        <h3><i class="fas fa-map-marker-alt"></i> Origem da Entrega</h3>
                        <div class="config-field">
                            <label for="enderecoOrigem">Endereço de origem (de onde saem as entregas)</label>
                            <input type="text" id="enderecoOrigem" placeholder="Ex: Rua Principal, 100, Salto, SP">
                        </div>
                    </div>

                    <div class="config-section">
                        <h3><i class="fas fa-truck"></i> Custo de Entrega</h3>
                        <div class="config-field">
                            <label for="custoPorKm">Custo base por KM (R$)</label>
                            <input type="number" id="custoPorKm" step="0.50" min="0" value="3.00" placeholder="3.00">
                        </div>

                        <div class="config-field">
                            <label>Regras de Incremento</label>
                            <div class="regras-list" id="regrasList">
                                <!-- Regras dinâmicas aqui -->
                            </div>
                            <button class="btn-add-regra" onclick="adicionarRegra()">
                                <i class="fas fa-plus"></i> Adicionar Regra
                            </button>
                        </div>
                    </div>

                    <div class="config-section">
                        <h3><i class="fas fa-exchange-alt"></i> Produtos como Pagamento</h3>
                        <div class="config-field">
                            <label for="regrasProdutos">Descreva os valores que aceita como troca</label>
                            <textarea id="regrasProdutos" rows="5"
                                placeholder="Placa de vídeo 4gb: R$300&#10;Placa de vídeo 8gb: R$400&#10;Não aceito memória RAM DDR2"></textarea>
                        </div>
                    </div>

                    <div class="config-section">
                        <h3><i class="fas fa-info-circle"></i> Instruções Adicionais</h3>
                        <div class="config-field">
                            <label for="instrucoesAdicionais">Instruções extras para a IA</label>
                            <textarea id="instrucoesAdicionais" rows="4"
                                placeholder="Ex: Sempre pergunte o horário preferido de entrega. Ofereça desconto para entregas acima de 50km."></textarea>
                        </div>
                    </div>

                    <button class="btn-save-config" id="btnSaveConfig" onclick="salvarConfiguracao()">
                        <i class="fas fa-save"></i> Salvar Configuração
                    </button>
                </div>

                <!-- Tab: Chat -->
                <div class="chat-tab-content active" id="contentChat">
                    <div class="chat-container">
                        <div class="chat-header">
                            <div class="chat-header-title">
                                <i class="fas fa-robot"></i>
                                <span>Assistente ERP Maneiro</span>
                            </div>
                            <button class="btn-clear-chat" onclick="limparChat()">
                                <i class="fas fa-trash-alt"></i> Limpar
                            </button>
                        </div>

                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-empty" id="chatEmpty">
                                <i class="fas fa-comments"></i>
                                <p>Olá! Sou o assistente do ERP Maneiro. Posso ajudar com cálculos de entrega, valores
                                    de produtos como pagamento e muito mais. Faça sua pergunta!</p>
                            </div>
                        </div>

                        <div class="chat-typing" id="chatTyping">
                            <div class="chat-avatar" style="background:rgba(138,43,226,0.15);color:#bb86fc;">
                                <i class="fas fa-robot"></i>
                            </div>
                            <div class="typing-dots">
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                            </div>
                        </div>

                        <div class="chat-input-area">
                            <div class="chat-input-wrapper">
                                <textarea id="chatInput" placeholder="Digite sua mensagem..." rows="1"></textarea>
                            </div>
                            <button class="btn-send" id="btnSend" onclick="enviarMensagem()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/redirect_fix.js"></script>
    <script src="js/api_config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/sidebar-template.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/internal-animation.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>

</html>
