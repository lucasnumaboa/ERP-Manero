<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
    <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ERP Maneiro">
    <title>ERP Maneiro - Fornecedores</title>
    <link rel="stylesheet" href="css/styles.css?v=4a2ec3f312">
    <link rel="stylesheet" href="css/permissions.css?v=f1df341f0a">
    <link rel="stylesheet" href="css/dashboard.css?v=1c79918a68">
    <link rel="stylesheet" href="css/modulos.css?v=fdd4166201">
    <link rel="stylesheet" href="css/submenu.css?v=fc4e2a67d9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/theme-dark.css?v=0137d572a5">
    <link rel="stylesheet" href="css/theme-light.css?v=feb5136289">
    <style>
        /* Adicione o CSS personalizado aqui */
    </style>
    <script src="js/config.js?v=51d36d9258"></script>
    <script src="js/avisos.js?v=21d04a4fda"></script>
    <link rel="stylesheet" href="css/celular.css?v=f62dbead6d">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="img/icon.png" alt="ERP Maneiro" class="logo-img">
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <h3 id="userName">Carregando...</h3>
                    <p id="userRole">Carregando...</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Preenchido pelo js/sidebar-template.js conforme as permissões do usuário -->
                <ul>
                    <li class="logout"><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="content">
                <div class="page-header">
                    <h1>Gerenciamento de Fornecedores</h1>
                    <p>Cadastre e gerencie seus fornecedores para compras e reposição de estoque</p>
                </div>

                <!-- Ações de Fornecedores -->
                <div class="actions-bar">
                    <button class="btn-primary" id="btnNovoFornecedor">
                        <i class="fas fa-plus"></i> Novo Fornecedor
                    </button>

                    <div class="filter-group">
                        <label for="filtroStatus">Status:</label>
                        <select id="filtroStatus">
                            <option value="">Todos</option>
                            <option value="true">Ativos</option>
                            <option value="false">Inativos</option>
                        </select>
                    </div>
                </div>

                <!-- Tabela de Fornecedores -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Documento</th>
                                <th>Contato</th>
                                <th>Cidade/UF</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="fornecedoresTableBody">
                            <tr>
                                <td colspan="7" class="text-center">Carregando fornecedores...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div class="pagination">
                    <button class="btn-page"><i class="fas fa-chevron-left"></i></button>
                    <button class="btn-page active">1</button>
                    <button class="btn-page">2</button>
                    <button class="btn-page">3</button>
                    <button class="btn-page"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Novo/Editar Fornecedor -->
    <div class="modal" id="fornecedorModal">
        <div class="modal-content modal-lg modal-vendas">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Fornecedor</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="fornecedorForm">
                    <input type="hidden" id="fornecedor_id">

                    <!-- Sistema de Abas -->
                    <div class="modal-tabs">
                        <button type="button" class="modal-tab active" data-tab="tab-dados-fornecedor">
                            <i class="fas fa-building"></i> Dados
                        </button>
                        <button type="button" class="modal-tab" data-tab="tab-endereco-fornecedor">
                            <i class="fas fa-map-marker-alt"></i> Endereço
                        </button>
                    </div>

                    <!-- Aba 1: Dados do Fornecedor -->
                    <div class="modal-tab-content active" id="tab-dados-fornecedor">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tipo">Tipo</label>
                                <select id="tipo" name="tipo" required>
                                    <option value="fornecedor">Fornecedor</option>
                                    <option value="ambos">Cliente e Fornecedor</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="ativo">Status</label>
                                <select id="ativo" name="ativo">
                                    <option value="true">Ativo</option>
                                    <option value="false">Inativo</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nome">Nome/Razão Social*</label>
                                <input type="text" id="nome" name="nome" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="documento">CPF/CNPJ</label>
                                <input type="text" id="documento" name="documento">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email">
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone</label>
                                <input type="text" id="telefone" name="telefone">
                            </div>
                        </div>
                    </div>

                    <!-- Aba 2: Endereço -->
                    <div class="modal-tab-content" id="tab-endereco-fornecedor">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cep">CEP</label>
                                <input type="text" id="cep" name="cep">
                            </div>
                            <div class="form-group">
                                <label for="endereco">Endereço</label>
                                <input type="text" id="endereco" name="endereco">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cidade">Cidade</label>
                                <input type="text" id="cidade" name="cidade">
                            </div>
                            <div class="form-group small">
                                <label for="estado">UF</label>
                                <select id="estado" name="estado">
                                    <option value="">Selecione...</option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" id="btnCancelar">Cancelar</button>
                <button class="btn-primary" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=ac6757d260"></script>
    <script src="js/api.js?v=fee2f98a38"></script>
    <script src="js/sidebar-template.js?v=64a81dca5e"></script>
    <script src="js/pagination.js?v=87595b957f"></script>
    <script src="js/permissions.js?v=8ad3de3eb5"></script>
    <script src="js/setupModals.js?v=f3b8a1828f"></script>
    <script src="js/fornecedores.js?v=5c828137df"></script>
    <script src="js/filtro-pesquisa.js?v=687a03eaf8"></script>
    <script src="js/internal-animation.js?v=7d7314b65d"></script>
    <script src="js/theme-switcher.js?v=2435969ea2"></script>
</body>

</html>
