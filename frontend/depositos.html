<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
    <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ERP Maneiro">
    <title>ERP Maneiro - Depósitos</title>
    <link rel="stylesheet" href="css/styles.css?v=4a2ec3f312">
    <link rel="stylesheet" href="css/permissions.css?v=f1df341f0a">
    <link rel="stylesheet" href="css/dashboard.css?v=1c79918a68">
    <link rel="stylesheet" href="css/produtos.css?v=2d4ef86bcf">
    <link rel="stylesheet" href="css/modulos.css?v=fdd4166201">
    <link rel="stylesheet" href="css/submenu.css?v=fc4e2a67d9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/theme-dark.css?v=0137d572a5">
    <link rel="stylesheet" href="css/theme-light.css?v=feb5136289">
    <script src="js/config.js?v=10a6dfd4e3"></script>
    <script src="js/avisos.js?v=21d04a4fda"></script>
    <link rel="stylesheet" href="css/celular.css?v=f62dbead6d">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="img/icon.png" alt="ERP Maneiro" class="logo-img">
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <h3 id="userName">Carregando...</h3>
                    <p id="userRole">Carregando...</p>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="content">
                <div class="page-header">
                    <h1>Gerenciamento de Depósitos</h1>
                    <p>Cadastre, edite e gerencie os depósitos usados para localizar o estoque</p>
                </div>

                <!-- Ações de Depósitos -->
                <div class="actions-bar">
                    <div class="actions-left">
                        <button class="btn-primary" id="btnNovoDeposito">
                            <i class="fas fa-plus"></i> Novo Depósito
                        </button>
                    </div>
                </div>

                <!-- Tabela de Depósitos -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th class="text-center">Padrão</th>
                                <th class="text-center">Produtos</th>
                                <th class="text-center">Status</th>
                                <th class="actions-column">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="depositosTableBody">
                            <tr>
                                <td colspan="7" class="text-center">Carregando depósitos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Novo/Editar Depósito -->
    <div class="modal" id="depositoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Depósito</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="depositoForm">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="ativo" name="ativo" checked>
                            <span class="checkmark"></span>
                            Depósito Ativo
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" id="btnCancelar">Cancelar</button>
                <button class="btn-primary" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=0bdde0a233"></script>
    <script src="js/api.js?v=fee2f98a38"></script>
    <script src="js/sidebar-template.js?v=7fb4da4c64"></script>
    <script src="js/permissions.js?v=8ad3de3eb5"></script>
    <script src="js/setupModals.js?v=f3b8a1828f"></script>
    <script src="js/depositos.js?v=1b5c296b42"></script>
    <script src="js/internal-animation.js?v=7d7314b65d"></script>
    <script src="js/theme-switcher.js?v=2435969ea2"></script>
</body>

</html>
