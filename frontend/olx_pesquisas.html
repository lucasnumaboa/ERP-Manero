<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Maneiro - Pesquisas OLX</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modulos.css">
    <link rel="stylesheet" href="css/submenu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <style>
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px 0;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #1a1a2e;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #555;
            font-size: 48px;
        }

        .product-checkbox-container {
            position: absolute;
            top: 10px;
            left: 10px;
        }

        .product-checkbox-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .product-visibility-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .product-body {
            padding: 15px;
        }

        .product-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-clamp: 2;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }

        .product-search-tag {
            display: inline-block;
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 10px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .product-actions .btn-icon {
            flex: 1;
            padding: 8px;
            text-align: center;
        }

        .badge-visible {
            background: #27ae60;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
        }

        .badge-hidden {
            background: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
        }

        .filter-select {
            min-width: 180px;
        }

        .filter-select select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 16px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="img/icon.png" alt="ERP Maneiro" class="logo-img">
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <h3 id="userName">Carregando...</h3>
                    <p id="userRole">Carregando...</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- O sidebar-template.js irá popular este menu dinamicamente -->
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="content">
                <div class="page-header">
                    <h1><i class="fas fa-search"></i> Pesquisas OLX</h1>
                    <p>Visualize e gerencie os produtos encontrados nas pesquisas OLX</p>
                </div>

                <!-- Stats -->
                <div class="stats-bar">
                    <div class="stat-card">
                        <div class="stat-value" id="totalProdutos">0</div>
                        <div class="stat-label">Total de Produtos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="produtosVisiveis">0</div>
                        <div class="stat-label">Visíveis</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="produtosOcultos">0</div>
                        <div class="stat-label">Ocultos</div>
                    </div>
                    <div class="stat-card" id="pendentesCard" style="cursor: pointer;" title="Clique para avaliar">
                        <div class="stat-value" id="produtosPendentes" style="color: #f39c12;">0</div>
                        <div class="stat-label">Pendentes de Avaliação</div>
                    </div>
                </div>

                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Pesquisar produtos...">
                    </div>
                    <div class="filter-select">
                        <select id="pesquisaFilter">
                            <option value="">Todas as Pesquisas</option>
                        </select>
                    </div>
                    <button class="btn-outline" id="btnToggleHidden">
                        <i class="fas fa-eye-slash"></i> Mostrar Ocultos
                    </button>
                    <button class="btn-primary" id="btnShowSelected" disabled>
                        <i class="fas fa-eye"></i> Mostrar Selecionados
                    </button>
                    <button class="btn-outline" id="btnHideSelected" disabled>
                        <i class="fas fa-eye-slash"></i> Ocultar Selecionados
                    </button>
                    <button class="btn-primary" id="btnAvaliar" style="background: #9b59b6;">
                        <i class="fas fa-robot"></i> Avaliar Produtos
                    </button>
                    <button class="btn-outline" id="btnReavaliar" title="Reseta e reavalia todos os produtos">
                        <i class="fas fa-sync-alt"></i> Reavaliar Todos
                    </button>
                </div>

                <!-- Lista de produtos -->
                <div id="productsList" class="products-grid">
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Carregando produtos...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/sidebar-template.js"></script>
    <script src="js/olx_pesquisas.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>

</html>
