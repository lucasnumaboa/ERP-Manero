<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
    <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ERP Maneiro">
    <title>ERP Maneiro - Flags OLX</title>
    <link rel="stylesheet" href="css/styles.css?v=4a2ec3f312">
    <link rel="stylesheet" href="css/dashboard.css?v=1c79918a68">
    <link rel="stylesheet" href="css/modulos.css?v=fdd4166201">
    <link rel="stylesheet" href="css/submenu.css?v=fc4e2a67d9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/theme-dark.css?v=0137d572a5">
    <link rel="stylesheet" href="css/theme-light.css?v=feb5136289">
    <style>
        .badge-include {
            background: #27ae60;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .badge-exclude {
            background: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .keywords-preview {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            color: var(--text-muted);
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
    </style>
    <script src="js/config.js?v=10a6dfd4e3"></script>
    <script src="js/avisos.js?v=21d04a4fda"></script>
    <link rel="stylesheet" href="css/celular.css?v=f62dbead6d">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="img/icon.png" alt="ERP Maneiro" class="logo-img">
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <h3 id="userName">Carregando...</h3>
                    <p id="userRole">Carregando...</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- O sidebar-template.js irá popular este menu dinamicamente -->
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="content">
                <div class="page-header">
                    <h1><i class="fas fa-filter"></i> Flags de Pesquisa</h1>
                    <p>Configure filtros para incluir ou excluir produtos baseado em palavras-chave</p>
                </div>

                <!-- Formulário de Nova Flag -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><i class="fas fa-plus"></i> Nova Flag</h3>
                    </div>
                    <div class="card-body">
                        <form id="flagForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="nome">Nome da Flag *</label>
                                    <input type="text" id="nome" name="nome" required placeholder="Ex: Defeito">
                                </div>
                                <div class="form-group">
                                    <label>Tipo *</label>
                                    <div class="radio-group">
                                        <label>
                                            <input type="radio" name="incluir" value="true" checked>
                                            <span class="badge-include">Incluir</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="incluir" value="false">
                                            <span class="badge-exclude">Excluir</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="palavras_chave">Palavras-chave *</label>
                                <textarea id="palavras_chave" name="palavras_chave" rows="2" required
                                    placeholder="Separadas por vírgula: com defeito, não funciona, quebrado"></textarea>
                                <small class="text-muted">Separe as palavras-chave por vírgula</small>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn-primary">
                                    <i class="fas fa-save"></i> Salvar Flag
                                </button>
                                <button type="button" class="btn-outline" id="btnCancelar" style="display: none;">
                                    <i class="fas fa-times"></i> Cancelar
                                </button>
                            </div>
                            <input type="hidden" id="flag_id">
                        </form>
                    </div>
                </div>

                <!-- Lista de Flags -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-list"></i> Flags Cadastradas</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table" id="flagsTable">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nome</th>
                                        <th>Tipo</th>
                                        <th>Palavras-chave</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="5" class="text-center">Carregando...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js?v=fee2f98a38"></script>
    <script src="js/auth.js?v=0bdde0a233"></script>
    <script src="js/sidebar-template.js?v=7fb4da4c64"></script>
    <script src="js/olx_flags.js?v=e92d8bad79"></script>
    <script src="js/theme-switcher.js?v=2435969ea2"></script>
</body>

</html>
