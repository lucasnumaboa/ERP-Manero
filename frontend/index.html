<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a192f">
    <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
    <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ERP Maneiro">
    <title>ERP Maneiro - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/permissions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </style>
    <script src="js/config.js"></script>
    <script src="js/avisos.js"></script>
</head>

<body class="login-page">
    <!-- Canvas para animação de fundo estilo ERP/Next.js -->
    <canvas id="bgCanvas"></canvas>

    <div class="login-container">
        <div class="login-logo">
            <picture>
                <source srcset="erp-manero.webp" type="image/webp">
                <img src="erp-manero.gif" alt="ERP Maneiro Logo" class="logo-gif">
            </picture>
        </div>
        <div class="login-header">
            <p>Sistema de Gestão Empresarial</p>
        </div>
        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-user"></i></label>
                    <input type="email" id="email" name="email" placeholder="Email" autocomplete="username" required>
                </div>
                <div class="form-group password-group">
                    <label for="password"><i class="fas fa-lock"></i></label>
                    <input type="password" id="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="toggle-password" title="Mostrar/Ocultar senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="form-group remember-group">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Lembrar e-mail</span>
                    </label>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-login">Entrar</button>
                </div>
                <div id="loginMessage" class="message-container"></div>
            </form>
        </div>
        <div class="login-footer">
            <p>&copy; 2025 ERP Maneiro - Todos os direitos reservados</p>
        </div>
    </div>

    <script src="js/redirect_fix.js"></script>
    <script src="js/api_config.js"></script>
    <script src="js/login.js"></script>
    <script src="js/login-animation.js"></script>
</body>

</html>
