services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: erp-maneiro-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-erp_maneiro}
      MYSQL_USER: ${DB_USER:-erp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-erp_password}
    ports:
      - "${DB_PORT_EXTERNAL:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - erp-network

  # FastAPI Backend
  backend:
    # nome fixo: o pacote de instalação (deploy/imagens) leva esta imagem pronta, sem precisar montar
    image: erp-maneiro-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-maneiro-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-erp_user}
      DB_PASSWORD: ${DB_PASSWORD:-erp_password}
      DB_NAME: ${DB_NAME:-erp_maneiro}
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env (veja .env.docker)}
      # botão "Atualizar" em Configurações: quem atualiza é o serviço atualizador (abaixo)
      ERP_MODO: docker
      ATUALIZADOR_URL: http://atualizador:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/frontend/uploads
    networks:
      - erp-network

  # Nginx Frontend
  frontend:
    image: erp-maneiro-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: erp-maneiro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - erp-network

  # Atualizador (botão "Atualizar" em Configurações): traz o código do GitHub para esta pasta e remonta
  # backend e tela. Precisa do Docker do computador (docker.sock); não tem porta para fora e só atende o
  # backend, que manda a SECRET_KEY. Banco e fotos ficam nos volumes e não são tocados.
  atualizador:
    image: erp-maneiro-atualizador:latest
    build:
      context: .
      dockerfile: Dockerfile.atualizador
    container_name: erp-maneiro-atualizador
    restart: unless-stopped
    environment:
      ATUALIZADOR_TOKEN: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env (veja .env.docker)}
      ERP_REPO_URL: ${ERP_REPO_URL:-https://github.com/lucasnumaboa/ERP-Manero.git}
      ERP_BRANCH: ${ERP_BRANCH:-main}
    volumes:
      - ./:/projeto
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - erp-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  erp-network:
    driver: bridge
